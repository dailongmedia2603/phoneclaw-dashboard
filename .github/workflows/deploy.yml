name: Deploy PhoneClaw Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      APP_DIR: /opt/phoneclaw-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync to VPS
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Ensure remote dirs exist
          $SSH_CMD $VPS_USER@$VPS_HOST "mkdir -p $APP_DIR/server/data $APP_DIR/src/types $APP_DIR/dist"

          # Sync entire project (exclude heavy/local files)
          rsync -avz --delete \
            -e "$SSH_CMD" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='server/data/*.json' \
            --exclude='src/' \
            --exclude='.github/' \
            ./ $VPS_USER@$VPS_HOST:$APP_DIR/

          # Also sync src/types (needed by server at runtime)
          rsync -avz \
            -e "$SSH_CMD" \
            src/types/ $VPS_USER@$VPS_HOST:$APP_DIR/src/types/

      - name: Setup & Deploy
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          $SSH_CMD $VPS_USER@$VPS_HOST "
            cd $APP_DIR

            # First-time nginx setup
            if [ ! -f /etc/nginx/sites-available/phoneclaw ]; then
              bash deploy/setup-vps.sh
            fi

            # Install deps + deploy
            bash deploy/deploy.sh
          "

      - name: Health check
        run: |
          sleep 5
          STATUS=\$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 10 http://$VPS_HOST/api/health || echo '000')
          if [ "\$STATUS" = "200" ]; then
            echo "✅ Dashboard live at http://$VPS_HOST"
          else
            echo "⚠️ Health check: \$STATUS"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST 'pm2 logs phoneclaw-dashboard --lines 20 --nostream' || true
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
