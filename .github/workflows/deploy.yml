name: Deploy PhoneClaw Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      APP_DIR: /opt/phoneclaw-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to VPS
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Ensure remote dirs exist
          $SSH_CMD $VPS_USER@$VPS_HOST "mkdir -p $APP_DIR/nginx/conf.d"

          # Sync project files to VPS
          # --exclude='server/data/**' protects production data
          # --exclude='.env' protects production environment config
          rsync -avz --delete \
            -e "$SSH_CMD" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='server/data/**' \
            --exclude='.env' \
            --exclude='.github/' \
            --exclude='plans/' \
            --exclude='nginx/conf.d/default.conf' \
            ./ $VPS_USER@$VPS_HOST:$APP_DIR/

      - name: Build & Deploy with Docker
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          $SSH_CMD $VPS_USER@$VPS_HOST "
            cd $APP_DIR

            echo '=== Building Docker image... ==='
            docker compose build --no-cache

            echo '=== Restarting containers... ==='
            docker compose up -d

            echo '=== Waiting for health check... ==='
            sleep 10
            docker compose ps
          "

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "https://$VPS_HOST/api/health" || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Dashboard live at https://phoneagent.io.vn"
          else
            echo "Health check returned $STATUS - checking logs..."
            SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
            $SSH_CMD $VPS_USER@$VPS_HOST "cd /opt/phoneclaw-dashboard && docker compose logs app --tail 20"
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
