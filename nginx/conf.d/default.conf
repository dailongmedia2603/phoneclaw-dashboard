# ============================================================
# PhoneAgent Dashboard — Nginx Configuration
# Domain: phoneagent.io.vn
# ============================================================

# --- HTTP: Redirect to HTTPS + Let's Encrypt challenge ---
server {
    listen 80;
    server_name phoneagent.io.vn;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Main server ---
server {
    listen 443 ssl;
    http2 on;
    server_name phoneagent.io.vn;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/phoneagent.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phoneagent.io.vn/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upload limit (for video uploads to R2)
    client_max_body_size 500M;

    # Proxy timeouts for long-running connections
    proxy_connect_timeout 60s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;

    # --- All traffic → App container ---
    location / {
        proxy_pass http://app:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket endpoint ---
    location /ws {
        proxy_pass http://app:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # --- VNC WebSocket proxy ---
    location ~ ^/vnc/.+/websockify$ {
        proxy_pass http://app:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
